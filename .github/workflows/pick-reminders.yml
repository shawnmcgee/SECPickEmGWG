name: Pick reminders

# Nudges opted-in players on Discord about games locking soon.
#
# HOW THIS STAYS ON TIME. GitHub silently drops most high-frequency cron
# firings: the old every-10-minutes schedule averaged 5.4 runs a day over 56
# days, with gaps up to ~10 hours. A run that does start, though, runs fine.
# So each run is a loop (.github/scripts/reminder-loop.sh): it sweeps every 5
# minutes for ~5h40m, then starts its own successor with workflow_dispatch,
# which cron's dropping does not affect. Reminders land ~70-75 minutes before
# kickoff instead of whenever GitHub got around to it.
#
# The loop sleeps between slates -- it exits without a successor once the next
# reminder is more than a day out -- and the cron below exists only to wake it.
# Cron only has to land once in that day-long runway, which even GitHub's
# worst observed gap manages comfortably.
#
# Starting it by hand: Actions -> Pick reminders -> Run workflow, with "Report
# who would be pinged" UNCHECKED. Checked (the default) is a one-off dry run.
#
# GitHub disables scheduled workflows in public repos after 60 days with no
# commits, and a disabled workflow cannot run at all, loop included. Each loop
# run re-enables this workflow, which resets that clock. If the Actions tab
# ever shows it disabled anyway, re-enable it there.

on:
  schedule:
    # Wake-up calls only. Off the top of the hour, which GitHub documents as
    # its busiest and likeliest-to-drop moment.
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    # Merging a change to the reminder pipeline starts the loop right away
    # rather than waiting for a wake-up call to land.
    branches: [main]
    paths:
      - .github/workflows/pick-reminders.yml
      - .github/scripts/reminder-loop.sh
      - api/notify-reminders.js
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Report who would be pinged without sending anything'
        type: boolean
        default: true
      handoffFrom:
        description: 'Internal - leave blank (set when one loop run starts the next)'
        type: string
        default: ''

# Deliberately no `concurrency:` group. A group would queue every wake-up call
# behind the running loop, and each new arrival cancels the one queued before
# it -- a stream of "cancelled" runs. Instead the script itself stands down if
# an older run is already looping, and the dedupe table makes any brief overlap
# harmless.

permissions:
  actions: write   # list this workflow's runs, and dispatch the next loop run
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    # GitHub's hard cap for a hosted job is 360. The loop hands off at 340.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Reminder loop
        env:
          SITE_URL: ${{ secrets.PICKEM_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '0' }}
          HANDOFF_FROM: ${{ inputs.handoffFrom }}
          # Give Vercel a moment to finish deploying the endpoint change that
          # triggered this push before the first sweep hits it.
          INITIAL_DELAY_SECONDS: ${{ github.event_name == 'push' && '120' || '0' }}
        run: bash .github/scripts/reminder-loop.sh
